# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests
on:
  schedule:
  - cron: '37 13 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/stale@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

        # Issues
        days-before-issue-stale: 4
        days-before-issue-close: 3
        stale-issue-label: 'no-issue-activity'
        stale-issue-message: >
          This issue has had no activity for 4 days. If you're still working on it,
          please comment to keep it open. Otherwise, it will be closed in 3 days to
          keep the backlog manageable and free it up for other contributors.
        close-issue-message: >
          Closing this issue due to inactivity. Feel free to reopen or comment if
          you'd like to pick it back up.

        # Pull Requests
        days-before-pr-stale: 4
        days-before-pr-close: 3
        stale-pr-label: 'no-pr-activity'
        stale-pr-message: >
          This PR has had no activity for 4 days. Please push an update or comment
          if you're still working on it, otherwise it will be closed in 3 days.
        close-pr-message: >
          Closing this PR due to inactivity. Feel free to reopen or submit a new PR
          if you'd like to continue this work.

        # Don't auto-stale/close issues that are actively assigned or flagged important
        exempt-issue-labels: 'help wanted,pinned'
        exempt-pr-labels: 'help wanted,pinned'

        # Remove stale label automatically if activity resumes
        remove-stale-when-updated: true
